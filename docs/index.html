const PERIOD_MULT = { daily: 0.85, weekly: 1.4 };

function generateTrail(sector, periods, periodMode) {
  const speed = sector.speed * PERIOD_MULT[periodMode];
  const pts = [];
  for (let i = periods - 1; i >= 0; i--) {
    const phase = sector.phase + i * speed;
    const radiusVar = sector.radius * (1 + 0.07 * Math.sin(i * 0.6 + sector.phase * 2));
    pts.push({ r: 100 + radiusVar * Math.cos(phase), m: 100 + radiusVar * Math.sin(phase) });
  }
  return pts;
}
const QUAD = {
  leading:   { label: 'Leading',   short: 'LEAD', color: '#10b981', bg: 'rgba(16,185,129,0.05)',  border: 'rgba(16,185,129,0.25)',  action: 'Hold longs. Trail stops on extended names.',     icon: TrendingUp },
  weakening: { label: 'Weakening', short: 'WEAK', color: '#f59e0b', bg: 'rgba(245,158,11,0.05)',  border: 'rgba(245,158,11,0.25)',  action: 'Take profits. Tighten stops below recent swings.', icon: AlertCircle },

const SIGNAL_MAP = {
  'improving>leading': { tag: 'BUY',     label: 'Bull Confirmed',  color: '#10b981', priority: 1 },
  'lagging>improving': { tag: 'WATCH',   label: 'Early Reversal',  color: '#3b82f6', priority: 2 },

  'leading>improving': { tag: 'CURL',    label: 'Curl Back',       color: '#3b82f6', priority: 3 },
  'improving>lagging': { tag: 'FAIL',    label: 'Failed Move',     color: '#ef4444', priority: 3 },
  'lagging>weakening': { tag: 'BOUNCE',  label: 'Dead-Cat?',       color: '#a78bfa', priority: 3 },
  'weakening>leading': { tag: 'REACCEL', label: 'Reacceleration',  color: '#10b981', priority: 2 },
};

function getQuadrant(r, m) {
  if (r >= 100 && m >= 100) return 'leading';
  if (r >= 100 && m < 100)  return 'weakening';
  if (r < 100  && m < 100)  return 'lagging';
  return 'improving';
}

function detectSignals(trail, sector) {
  const signals = [];
  for (let i = 1; i < trail.length; i++) {
    const prevQ = getQuadrant(trail[i - 1].r, trail[i - 1].m);
    const currQ = getQuadrant(trail[i].r, trail[i].m);
    if (prevQ !== currQ) {
      signals.push({
        sector,
        from: prevQ,
        to: currQ,
        periodsAgo: trail.length - 1 - i,
        meta: SIGNAL_MAP[`${prevQ}>${currQ}`] || { tag: 'MOVE', label: 'Quadrant Change', color: '#94a3b8', priority: 4 },
      });
    }
  }
  return signals;
}

  if (sctr >= 90) return '#10b981';

  if (sctr >= 40) return '#f97316';

}

  const [drillIndustry, setDrillIndustry] = useState(null);

  const SECTORS = liveData?.sectors || SECTORS_DEMO;
  const DRILLDOWN_DATA = liveData?.drilldown || DRILLDOWN_DEMO;
const sectorData = useMemo(() => {
    return SECTORS.map((s) => {
      const fullTrail = s.trail || generateTrail(s, tail, periodMode);
      const displayLen = playT === null ? fullTrail.length : Math.min(playT + 1, fullTrail.length);
      const trail = fullTrail.slice(0, displayLen);
      const current = trail[trail.length - 1] || { r: 100, m: 100 };
      const quadrant = getQuadrant(current.r, current.m);
      const velocity = trail.length > 1 ? 
        Math.hypot(trail[trail.length-1].r - trail[trail.length-2].r, 
                   trail[trail.length-1].m - trail[trail.length-2].m) : 0;
      const signals = detectSignals(fullTrail, s);
      const hasDrilldown = !!DRILLDOWN_DATA[s.ticker];
      return { ...s, trail, current, quadrant, velocity, signals, hasDrilldown, visible: !hidden.has(s.ticker) };
    });
  }, [SECTORS, DRILLDOWN_DATA, tail, periodMode, hidden, playT]);

  // ... (All the other logic: byQuadrant, topOpportunity, etc.)

  const drillSectorObj = drillSector ? sectorData.find(s => s.ticker === drillSector) : null;
  const drillIndustryObj = drillSector && drillIndustry ? 
    DRILLDOWN_DATA[drillSector]?.industries[drillIndustry] : null;

  return (

}

    (function() {
      var stageEl = document.getElementById('stage');
      var bootEl = document.getElementById('boot');
      
      function setStage(s) { if (stageEl) stageEl.textContent = s; }
      function setError(label, detail) {
        if (!bootEl) return;
        var err = document.createElement('div');
        err.className = 'err';
        err.textContent = label + (detail ? '\n\n' + detail : '');
        bootEl.appendChild(err);
      }

      window.addEventListener('error', function(e) {
        setError('ERROR', e.message || 'Unknown error');
      });

      setStage('stage 2 — compiling');
      setTimeout(() => {
        try {
          const src = document.getElementById('appsrc').textContent;
          const result = Babel.transform(src, { presets: ['react'] });
          new Function(result.code)();
          setStage('stage 3 — ready ✓');
        } catch (e) {
          setError('Failed to start', e.message);
        }
      }, 600);
    })();
  </script>
