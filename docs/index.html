<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Rotation" />
  <meta name="theme-color" content="#0a0e1a" />
  <title>Rotation Terminal · RRG</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230a0e1a'/%3E%3Ccircle cx='50' cy='50' r='3' fill='%2334d399'/%3E%3Ccircle cx='75' cy='30' r='2' fill='%2322d3ee'/%3E%3Ccircle cx='30' cy='70' r='2' fill='%23fbbf24'/%3E%3C/svg%3E">

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <style>
    html, body { margin: 0; padding: 0; background: #0a0e1a; color: #e2e8f0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    #root { min-height: 100vh; }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; background: #0a0e1a; color: #94a3b8; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; z-index: 9999; transition: opacity 0.4s; padding: 24px; text-align: center; }
    #boot.gone { opacity: 0; pointer-events: none; }
    #boot .dot { width: 6px; height: 6px; border-radius: 50%; background: #34d399; animation: bp 1.4s ease-in-out infinite; }
    #boot .row { display: flex; gap: 4px; }
    #boot .dot:nth-child(2) { animation-delay: 0.2s; }
    #boot .dot:nth-child(3) { animation-delay: 0.4s; }
    #boot .err { color: #fbbf24; font-size: 10px; max-width: 92%; word-break: break-word; line-height: 1.7; margin-top: 12px; padding: 14px; border: 1px solid rgba(251,191,36,0.3); border-radius: 6px; background: rgba(251,191,36,0.05); text-transform: none; letter-spacing: 0.04em; font-family: 'JetBrains Mono', monospace; text-align: left; white-space: pre-wrap; }
    #boot .stage { color: #475569; font-size: 9px; margin-top: 4px; }
    @keyframes bp { 0%, 100% { opacity: 0.3; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.1); } }
  </style>
</head>
<body>
  <div id="boot">
    <div class="row"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div>booting rotation terminal</div>
    <div class="stage" id="stage">stage 1 — loading libraries</div>
  </div>
  <div id="root"></div>

  <script id="appsrc" type="text/jsx-source">
const { useState, useMemo, useEffect, useRef } = React;
const { createRoot } = ReactDOM;

// Data Structure
const sectors = {
  XLF: {
    industries: {
      "Banks": { jks: 105.2, rrg: 102.5, price: 642.12, chg: 1.2 },
      "Capital Markets": { jks: 98.4, rrg: 99.1, price: 421.05, chg: -0.4 },
      "Insurance": { jks: 102.1, rrg: 101.8, price: 582.33, chg: 0.8 }
    }
  },
  XLK: {
    industries: {
      "Software": { jks: 112.4, rrg: 108.9, price: 1240.55, chg: 2.1 },
      "Semiconductors": { jks: 115.8, rrg: 110.2, price: 982.41, chg: 3.4 },
      "IT Services": { jks: 101.2, rrg: 100.5, price: 342.18, chg: 0.2 }
    }
  },
  XLI: {
    industries: {
      "Aerospace & Defense": { jks: 104.5, rrg: 103.2, price: 812.44, chg: 1.1 },
      "Machinery": { jks: 97.2, rrg: 98.8, price: 445.12, chg: -0.9 }
    }
  },
  XLV: {
    industries: {
      "Pharmaceuticals": { jks: 99.1, rrg: 99.8, price: 722.15, chg: -0.3 },
      "Biotechnology": { jks: 106.4, rrg: 104.1, price: 312.88, chg: 1.5 }
    }
  }
};

const App = () => {
  const [activeSector, setActiveSector] = useState('XLF');

  return (
    <div className="p-8">
      <header className="mb-8 border-b border-slate-800 pb-6">
        <h1 className="text-2xl font-semibold tracking-tight text-white">Rotation Terminal</h1>
        <p className="text-slate-500 text-sm mt-1">Relative Rotation Graph Data Feed</p>
      </header>

      <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
        {Object.keys(sectors).map(symbol => (
          <button 
            key={symbol}
            onClick={() => setActiveSector(symbol)}
            className={`p-4 rounded-lg border transition-all ${
              activeSector === symbol 
                ? 'bg-emerald-500/10 border-emerald-500/50 text-emerald-400' 
                : 'bg-slate-900/50 border-slate-800 text-slate-400 hover:border-slate-700'
            }`}
          >
            <div className="text-xs font-mono opacity-60">SECTOR</div>
            <div className="text-xl font-bold">{symbol}</div>
          </button>
        ))}
      </div>

      <div className="bg-slate-900/30 border border-slate-800 rounded-xl overflow-hidden">
        <table className="w-full text-left border-collapse">
          <thead>
            <tr className="bg-slate-900/80 text-slate-500 text-xs font-mono uppercase tracking-widest">
              <th className="p-4 border-b border-slate-800">Industry</th>
              <th className="p-4 border-b border-slate-800 text-right">Price</th>
              <th className="p-4 border-b border-slate-800 text-right">JKS</th>
              <th className="p-4 border-b border-slate-800 text-right">RRG</th>
              <th className="p-4 border-b border-slate-800 text-right">24h Chg</th>
            </tr>
          </thead>
          <tbody className="text-sm">
            {Object.entries(sectors[activeSector].industries).map(([name, data]) => (
              <tr key={name} className="border-b border-slate-800/50 hover:bg-slate-800/20 transition-colors">
                <td className="p-4 font-medium text-slate-200">{name}</td>
                <td className="p-4 text-right font-mono text-slate-400">${data.price.toFixed(2)}</td>
                <td className="p-4 text-right font-mono text-emerald-400">{data.jks}</td>
                <td className="p-4 text-right font-mono text-cyan-400">{data.rrg}</td>
                <td className={`p-4 text-right font-mono ${data.chg >= 0 ? 'text-emerald-500' : 'text-rose-500'}`}>
                  {data.chg >= 0 ? '+' : ''}{data.chg}%
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
};

// Bootstrapper
try {
  const stage = document.getElementById('stage');
  stage.innerText = 'stage 2 — compiling source';
  
  const source = document.getElementById('appsrc').innerHTML;
  const { code } = Babel.transform(source, { presets: ['react'] });
  
  stage.innerText = 'stage 3 — initializing ui';
  const script = document.createElement('script');
  script.text = code;
  document.body.appendChild(script);

  const root = createRoot(document.getElementById('root'));
  root.render(React.createElement(App));
  
  setTimeout(() => {
    document.getElementById('boot').classList.add('gone');
  }, 600);
} catch (err) {
  document.getElementById('boot').innerHTML += `<div class="err">${err.message}</div>`;
}
  </script>
</body>
</html>
