      var rootEl = document.getElementById('root');

        var bootEl = document.getElementById('boot');
        var msg = 'react failed to mount. ';
        if (typeof React === 'undefined') msg += 'react not loaded. ';
        else if (typeof ReactDOM === 'undefined') msg += 'reactdom not loaded. ';
        else if (typeof Babel === 'undefined') msg += 'babel not loaded. ';
        else msg += 'see safari console for jsx error.';
        var errDiv = document.createElement('div');
        errDiv.className = 'err';
        errDiv.textContent = msg;
        if (bootEl) bootEl.appendChild(errDiv);
      }
    }, 12000);

    setStage('stage 2 — checking globals');

const PERIOD_MULT = { daily: 0.85, weekly: 1.4 };

function generateTrail(sector, periods, periodMode) {
  const speed = sector.speed * PERIOD_MULT[periodMode];
  const pts = [];
  for (let i = periods - 1; i >= 0; i--) {
    const phase = sector.phase + i * speed;
    const radiusVar = sector.radius * (1 + 0.07 * Math.sin(i * 0.6 + sector.phase * 2));
    pts.push({ r: 100 + radiusVar * Math.cos(phase), m: 100 + radiusVar * Math.sin(phase) });
  }
  return pts;
}

function getQuadrant(r, m) {
  if (r >= 100 && m >= 100) return 'leading';
  if (r >= 100 && m < 100)  return 'weakening';
  if (r < 100  && m < 100)  return 'lagging';
  return 'improving';
}

const QUAD = {
  leading:   { label: 'Leading',   short: 'LEAD', color: '#10b981', bg: 'rgba(16,185,129,0.05)',  border: 'rgba(16,185,129,0.25)',  action: 'Hold longs. Trail stops on extended names.',     icon: TrendingUp },
  weakening: { label: 'Weakening', short: 'WEAK', color: '#f59e0b', bg: 'rgba(245,158,11,0.05)',  border: 'rgba(245,158,11,0.25)',  action: 'Take profits. Tighten stops below recent swings.', icon: AlertCircle },
  lagging:   { label: 'Lagging',   short: 'LAG',  color: '#ef4444', bg: 'rgba(239,68,68,0.05)',   border: 'rgba(239,68,68,0.25)',   action: 'Avoid longs. Source candidates for shorts.',       icon: TrendingDown },
  improving: { label: 'Improving', short: 'IMPR', color: '#3b82f6', bg: 'rgba(59,130,246,0.05)',  border: 'rgba(59,130,246,0.25)',  action: 'Watch for breakouts. Build pilot positions.',     icon: ArrowUpRight },
};

const SIGNAL_MAP = {
  'improving>leading': { tag: 'BUY',     label: 'Bull Confirmed',  color: '#10b981', priority: 1 },
  'lagging>improving': { tag: 'WATCH',   label: 'Early Reversal',  color: '#3b82f6', priority: 2 },
  'leading>weakening': { tag: 'TRIM',    label: 'Profit Take',     color: '#f59e0b', priority: 1 },
  'weakening>lagging': { tag: 'EXIT',    label: 'Trend Down',      color: '#ef4444', priority: 2 },
  'leading>improving': { tag: 'CURL',    label: 'Curl Back',       color: '#3b82f6', priority: 3 },
  'improving>lagging': { tag: 'FAIL',    label: 'Failed Move',     color: '#ef4444', priority: 3 },
  'lagging>weakening': { tag: 'BOUNCE',  label: 'Dead-Cat?',       color: '#a78bfa', priority: 3 },
  'weakening>leading': { tag: 'REACCEL', label: 'Reacceleration',  color: '#10b981', priority: 2 },
};

function detectSignals(trail, sector) {
  const signals = [];
  for (let i = 1; i < trail.length; i++) {
    const prevQ = getQuadrant(trail[i - 1].r, trail[i - 1].m);
    const currQ = getQuadrant(trail[i].r, trail[i].m);
    if (prevQ !== currQ) {
      signals.push({
        sector,
        from: prevQ,
        to: currQ,
        periodsAgo: trail.length - 1 - i,
        meta: SIGNAL_MAP[`${prevQ}>${currQ}`] || { tag: 'MOVE', label: 'Quadrant Change', color: '#94a3b8', priority: 4 },
      });
    }
  }
  return signals;
}

function getVelocity(trail) {
  if (trail.length < 2) return 0;
  const a = trail[trail.length - 2];
  const b = trail[trail.length - 1];
  return Math.hypot(b.r - a.r, b.m - a.m);
}

function getSCTRColor(sctr) {
  if (sctr >= 90) return '#10b981';
  if (sctr >= 75) return '#34d399';
  if (sctr >= 60) return '#fbbf24';
  if (sctr >= 40) return '#f97316';
  return '#ef4444';
}

function getSCTRLabel(sctr) {
  if (sctr >= 90) return 'Elite';
  if (sctr >= 75) return 'Strong';
  if (sctr >= 60) return 'Solid';
  if (sctr >= 40) return 'Mixed';
  return 'Weak';
}

    playRef.current = setInterval(() => {
      setPlayT((t) => {

        const next = start + 1;
        if (next >= tail) { setIsPlaying(false); return tail - 1; }
        return next;

    return () => clearInterval(playRef.current);
  }, [isPlaying, tail]);

  useEffect(() => {
    if (playT !== null && playT >= tail) setPlayT(tail - 1);
  }, [tail, playT]);

  const sectorData = useMemo(() => {
    return SECTORS.map((s) => {
      // Live data has a precomputed `trail` array; demo synthesizes one
      const fullTrail = s.trail && Array.isArray(s.trail) && s.trail.length > 0
        ? s.trail
        : generateTrail(s, tail, periodMode);
      const displayLen = playT === null ? fullTrail.length : Math.min(playT + 1, fullTrail.length);
      const trail = fullTrail.slice(0, displayLen);
      const current = trail[trail.length - 1] || { r: 100, m: 100 };
      const quadrant = getQuadrant(current.r, current.m);
      const velocity = getVelocity(trail);
      const signals = detectSignals(fullTrail, s);
      const drilldown = DRILLDOWN_DATA[s.ticker];

      return { ...s, trail, current, quadrant, velocity, signals, hasDrilldown, visible: !hidden.has(s.ticker) };

  const byQuadrant = useMemo(() => {

  // Top opportunity: best stock × industry × leading sector

          if (!best || score > best.score) {
            best = { score, sectorTicker: sec.ticker, sector: sec, indKey, industry: ind, stock: stk };

    });
    return best;

  const isLive = playT === null;
