<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Rotation Terminal · RRG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <style>
    body { background: #0a0e1a; color: #e2e8f0; font-family: sans-serif; margin: 0; }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0a0e1a; z-index: 9999; transition: opacity 0.5s; font-family: monospace; color: #34d399; }
    #boot.gone { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="boot">BOOTING ROTATION TERMINAL...</div>
  <div id="root"></div>

  <script id="appsrc" type="text/jsx-source">
const { useState } = React;

const sectors = {
  XLF: { industries: { "Banks": { price: 642.12, chg: 1.2 }, "Insurance": { price: 582.33, chg: 0.8 } } },
  XLK: { industries: { "Software": { price: 1240.55, chg: 2.1 }, "Semiconductors": { price: 982.41, chg: 3.4 } } },
  XLI: { industries: { "Aerospace": { price: 812.44, chg: 1.1 }, "Machinery": { price: 445.12, chg: -0.9 } } },
  XLV: { industries: { "Pharma": { price: 722.15, chg: -0.3 }, "Biotech": { price: 312.88, chg: 1.5 } } }
};

const App = () => {
  const [active, setActive] = useState('XLF');
  return (
    <div className="p-8">
      <h1 className="text-2xl font-bold mb-6 text-emerald-400">Rotation Terminal</h1>
      <div className="flex gap-4 mb-8">
        {Object.keys(sectors).map(s => (
          <button key={s} onClick={() => setActive(s)} 
            className={`px-6 py-3 rounded border ${active === s ? 'border-emerald-500 bg-emerald-500/10 text-emerald-400' : 'border-slate-800 text-slate-500'}`}>
            {s}
          </button>
        ))}
      </div>
      <div className="bg-slate-900/50 p-6 rounded-xl border border-slate-800">
        <h2 className="text-lg font-mono text-slate-400 mb-4 tracking-widest uppercase">Sector: {active}</h2>
        <div className="space-y-3">
          {Object.entries(sectors[active].industries).map(([name, data]) => (
            <div key={name} className="flex justify-between items-center py-3 border-b border-slate-800/50">
              <span className="font-medium">{name}</span>
              <div className="font-mono text-right">
                <div className="text-white">${data.price.toFixed(2)}</div>
                <div className={data.chg >= 0 ? 'text-emerald-500' : 'text-rose-500'}>
                  {data.chg >= 0 ? '+' : ''}{data.chg}%
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

// Start the app
try {
  const source = document.getElementById('appsrc').innerHTML;
  const { code } = Babel.transform(source, { presets: ['react'] });
  const script = document.createElement('script');
  script.text = code;
  document.body.appendChild(script);
  
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
  setTimeout(() => document.getElementById('boot').classList.add('gone'), 500);
} catch (e) {
  document.getElementById('boot').innerHTML = "ERROR: " + e.message;
}
  </script>
</body>
</html>
